name: Deploy

# Деплой только после зелёного CI на main — context/architecture/07-нефункциональные/деплой.md
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  pages:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Пока нет своего домена — игра живёт по /<репозиторий>/. С доменом: BASE_PATH=/ и файл CNAME.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BOT_LINK: https://t.me/nadorabotkubot
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
      - name: Previous deploy
        run: git fetch origin gh-pages:gh-pages && git worktree add old gh-pages || mkdir -p old
      - name: Keep assets of previous builds
        run: node tools/keep-assets.mjs old packages/game/dist
      - name: Publish to gh-pages
        run: |
          cd packages/game/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
