<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>НА ДОРАБОТКУ</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d12; color: #c8d0c0; overflow: hidden; touch-action: none; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
    <script>
      // Деплой поверх открытого WebView: старый index.html просит удалённые файлы → одна перезагрузка, потом экран «обнови».
      (function () {
        var KEY = 'nd.reloaded';
        function recover() {
          try {
            if (sessionStorage.getItem(KEY)) {
              document.body.innerHTML = '<p style="font:16px monospace;padding:24px">Вышла новая версия. Закрой и открой игру заново.</p>';
              return;
            }
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) recover();
        }, true);
        window.addEventListener('vite:preloadError', recover);
        window.addEventListener('load', function () {
          setTimeout(function () { try { sessionStorage.removeItem(KEY); } catch (e) {} }, 3000);
        });
      })();
    </script>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
